name: Player Center - Gesamtsynchronisierung

on:
  schedule:
    - cron: '0 6 * * *'
      timezone: Europe/Berlin
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: player-center-sync
  cancel-in-progress: false

jobs:
  darthelfer:
    uses: ./.github/workflows/import.yml
    secrets:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

  nuliga:
    needs: darthelfer
    uses: ./.github/workflows/import_nuliga.yml
    secrets:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

  reconcile:
    needs: [darthelfer, nuliga]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Importvollstaendigkeit pruefen
        env:
          DARTHELFER_SAFE: ${{ needs.darthelfer.outputs.safe_to_reconcile }}
        run: |
          if [ "$DARTHELFER_SAFE" != "true" ]; then
            echo "::error::Darthelfer-Import nicht freigegeben: Gesamtabgleich bewusst nicht ausgefuehrt."
            exit 1
          fi
      - name: Supabase Gesamtabgleich
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          python3 -u - <<'PY'
          import os, json, urllib.request, urllib.error
          url = os.environ['SUPABASE_URL'].strip().rstrip('/').removesuffix('/rest/v1')
          key = os.environ['SUPABASE_SERVICE_ROLE_KEY'].strip()
          if not url or not key:
              raise RuntimeError('Supabase-Zugangsdaten fehlen')
          headers = {'apikey': key, 'Content-Type': 'application/json'}
          if not key.startswith('sb_secret_'):
              headers['Authorization'] = 'Bearer ' + key
          check = urllib.request.Request(url + '/rest/v1/pc_import_problems?select=event_id&known_exception=eq.false&limit=1', headers=headers)
          with urllib.request.urlopen(check, timeout=45) as response:
              problems = json.load(response)
          if not isinstance(problems, list) or problems:
              raise RuntimeError('Neue Importprobleme: Gesamtabgleich gesperrt')
          req = urllib.request.Request(url + '/rest/v1/rpc/pc_reconcile_all', data=b'{}', headers=headers, method='POST')
          try:
              with urllib.request.urlopen(req, timeout=120) as response:
                  result = json.load(response)
          except urllib.error.HTTPError as exc:
              raise RuntimeError(f'Gesamtabgleich HTTP {exc.code}') from None
          if not isinstance(result, dict) or result.get('status') != 'completed' or result.get('identity_check', {}).get('status') != 'passed':
              raise RuntimeError('Gesamtabgleich nicht erfolgreich')
          print(json.dumps(result, ensure_ascii=False, indent=2))
          PY

  historical:
    needs: reconcile
    uses: ./.github/workflows/import_nuliga_historical_v1.yml
    with:
      write_import: true
    secrets:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

  portraits:
    # Eigenstaendig, ohne needs: kann Statistikimporte weder blockieren noch veraendern.
    uses: ./.github/workflows/import_portraits.yml
    secrets:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
