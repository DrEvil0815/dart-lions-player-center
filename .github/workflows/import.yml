name: Player Center - nuLiga Import
on:
  workflow_dispatch:
    inputs:
      write_db:
        description: 'Daten in Supabase speichern'
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: player-center-nuliga-test
  cancel-in-progress: false
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Python vorbereiten
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: HTML Parser installieren
        run: python -m pip install beautifulsoup4==4.13.4
      - name: Spielberichte pruefen und optional speichern
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          WRITE_DB: ${{ inputs.write_db }}
        run: |
          python -u - <<'PYCODE'
          import re, json, sys, time, traceback, os
          from datetime import datetime, timezone
          from urllib.parse import urlencode
          from urllib.parse import urljoin, urlparse, parse_qs
          from urllib.request import Request, urlopen
          from bs4 import BeautifulSoup
          from collections import Counter
          BASE='https://bdv-dart.liga.nu'
          WA=BASE+'/cgi-bin/WebObjects/nuLigaDARTDE.woa/wa/'
          CLUB='6042'
          GROUPS={'211419':'I','211414':'II','211415':'III','211398':'Pokal'}
          def txt(x): return ' '.join(x.stripped_strings)
          def param(url,key): return parse_qs(urlparse(url).query).get(key,[None])[0]
          def pair(s):
              m=re.fullmatch(r'(\d+)\s*:\s*(\d+)',s.strip())
              if not m: raise ValueError('Ergebnis nicht eindeutig: '+s)
              return tuple(map(int,m.groups()))
          def fetch(url):
              if urlparse(url).hostname != 'bdv-dart.liga.nu': raise ValueError('Unbekannter Host')
              time.sleep(1)
              with urlopen(Request(url,headers={'User-Agent':'Dart Lions Player Center/1.5','Accept':'text/html'}),timeout=35) as r:
                  body=r.read()
                  soup=BeautifulSoup(body,'html.parser')
                  print('HTTP:',r.status,'| URL:',r.geturl(),'| Typ:',r.headers.get('Content-Type'),'| Bytes:',len(body))
                  print('Titel:',txt(soup.title) if soup.title else '(fehlt)')
                  print('Meta vorhanden:',bool(soup.select_one('meta[name=nuLigaStatsUrl]')),'| Content vorhanden:',bool(soup.select_one('#content')))
                  if not soup.select_one('#content h1'):
                      print('Seitentext:',txt(soup.body or soup)[:700])
                  return soup
          def players(cell):
              return [{'name':txt(a),'person':param(a.get('href',''),'person'),'club':param(a.get('href',''),'club')} for a in cell.select('a[href*="playerPortrait"]')]
          def parse(s):
              meta_tag=s.select_one('meta[name=nuLigaStatsUrl]')
              if not meta_tag or not meta_tag.get('content'): raise ValueError('Kein nuLiga-Spielbericht: nuLigaStatsUrl fehlt')
              meta=meta_tag['content']; mid=param(meta,'meeting'); group=param(meta,'group')
              content=s.select_one('#content')
              if not content or not content.h1: raise ValueError('Spielbericht-Inhalt fehlt')
              heading=txt(content.h1); date=re.search(r'(\d{2}\.\d{2}\.\d{4})',heading).group(1)
              tables=content.select('table')
              def header(t):
                  r=t.find('tr')
                  return [txt(c) for c in r.find_all(['th','td'],recursive=False)] if r else []
              print('Ueberschriften:',[(h.name,txt(h)) for h in content.select('h1,h2,h3,h4')])
              print('Tabellenkoepfe:',[header(t) for t in tables])
              candidates=[t for t in tables if any(re.fullmatch(r'\d+-\d+|D\d+-D\d+|Team',txt(r.find('td')),re.I) for r in t.select('tr') if r.find('td')) and re.search(r'Legs:\s*\d+\s*:\s*\d+',txt(t))]
              if len(candidates)!=1: raise ValueError(f'Spielberichtstabelle nicht eindeutig: {len(candidates)} Kandidaten')
              table=candidates[0]
              headers=header(table)
              if len(headers)<4: raise ValueError('Tabellenkopf zu kurz: '+str(headers))
              home,away=headers[1:3]; matches=[]; totals=None
              for row in table.select('tr')[1:]:
                  c=row.find_all('td',recursive=False)
                  if not c: continue
                  label=txt(c[0]); rowtext=txt(row)
                  if 'Legs:' in rowtext:
                      legs=re.search(r'Legs:\s*(\d+\s*:\s*\d+)',rowtext).group(1); totals=(pair(legs),pair(txt(c[-1]))); continue
                  if not re.fullmatch(r'\d+-\d+|D\d+-D\d+|Team',label,re.I): continue
                  kind='team' if label.lower()=='team' else 'doubles' if label.startswith('D') else 'singles'
                  pp=[players(c[1]),players(c[2])]
                  score_text=txt(c[3]); result_text=txt(c[-1])
                  if not score_text and not result_text and kind=='team':
                      print('Nicht gespielte Zeile:',label,'| Zellen:',[txt(x) for x in c])
                      continue
                  if not score_text or not result_text:
                      raise ValueError('Teilweise leere Ergebniszeile: '+label+' | '+repr([txt(x) for x in c]))
                  score=pair(score_text); result=pair(result_text)
                  if kind!='team' and any(len(p)!=(2 if kind=='doubles' else 1) or any(not x['person'] for x in p) for p in pp): raise ValueError('Aufstellung unklar: '+label)
                  matches.append(dict(label=label,type=kind,players=pp,legs=score,result=result))
              if totals is None or not matches: raise ValueError('Kein vollständiges Ergebnis')
              calc=tuple(sum(m['legs'][i] for m in matches) for i in range(2)); results=tuple(sum(m['result'][i] for m in matches) for i in range(2))
              if (calc,results)!=totals: raise ValueError(f'Summenabweichung: {calc,results} != {totals}')
              clubs=[{p['club'] for m in matches for p in m['players'][i] if p['club']} for i in range(2)]
              if sum(CLUB in c for c in clubs)!=1: raise ValueError('Vereinsseite nicht eindeutig')
              side=1 if CLUB in clubs[0] else 2
              highlights=[]; averages=[]
              section=''
              for node in content.select('h1,h2,h3,h4,table'):
                  if node.name!='table':
                      section=txt(node)
                      continue
                  if node is table: continue
                  t=node
                  label=section
                  heads=header(t)
                  avside={'Heimmannschaft':1,'Gastmannschaft':2}.get(' '.join(heads))
                  if avside and any('Average' in txt(r) for r in t.select('tr')[:3]):
                      for row in t.select('tr'):
                          c=row.find_all('td',recursive=False)
                          if len(c)!=2: continue
                          p=players(c[0]); val=float(txt(c[1]).replace(',','.'))
                          if len(p)!=1 or not 0<=val<=180: raise ValueError('Average unklar')
                          averages.append(dict(player=p[0],side=avside,average=val))
                      continue
                  typ='180' if '180er' in label else 'highfinish' if 'High Finish' in label else 'short_leg' if 'Low Darts' in label else None
                  if not typ or not {'Anzahl','Wert'}.issubset(heads): continue
                  for row in t.select('tr'):
                      c=row.find_all('td',recursive=False)
                      if len(c)<4: continue
                      highlights.append(dict(type=typ,count=int(txt(c[0])),value=int(txt(c[1])),players=players(c[2]),team=txt(c[-1]),section=label))
              return dict(meeting=mid,group=group,date=date,competition=list(content.h1.stripped_strings)[1],event_time=re.search(r'(\d{2}:\d{2})\s*Uhr',heading).group(1),home=home,away=away,side=side,legs=totals[0],result=totals[1],approved=any(txt(p)=='Spielbericht durch Spielleiter genehmigt.' for p in content.select('p')),matches=matches,highlights=highlights,averages=averages)
          def show(d):
              print(f"{d['meeting']} | {d['date']} | {d['home']} - {d['away']} | {d['result']} | Legs {d['legs']} | Lions Seite {d['side']} | genehmigt {d['approved']}")
              print('Matches:',dict(Counter(m['type'] for m in d['matches'])), '| Highlights:',len(d['highlights']),'| Averages:',len(d['averages']))
              for h in d['highlights']: print('Highlight:',json.dumps(h,ensure_ascii=False))
              for a in d['averages']: print('Average:',json.dumps(a,ensure_ascii=False))
          def discover(schedule,url):
              links={}
              for a in schedule.select('a[href]'):
                  href=urljoin(url,a['href'])
                  mid=param(href,'meeting')
                  if not mid or urlparse(href).hostname!='bdv-dart.liga.nu' or not urlparse(href).path.endswith(('groupMeetingReport','clubMeetingReport')): continue
                  row=a.find_parent('tr')
                  if row is None: continue
                  if not re.search(r'Dart\s+Lions\s+Gräfenberg',txt(row),re.I): continue
                  links[mid]=href
              return links

          def save_reports(reports):
              base=os.environ['SUPABASE_URL'].strip().rstrip('/').removesuffix('/rest/v1')+'/rest/v1/'
              key=os.environ['SUPABASE_SERVICE_ROLE_KEY'].strip()
              if not key or not base.startswith('https://'): raise RuntimeError('Supabase-Zugangsdaten fehlen')
              headers={'apikey':key,'Content-Type':'application/json','Prefer':'resolution=merge-duplicates,return=representation'}
              if not key.startswith('sb_secret_'): headers['Authorization']='Bearer '+key
              def api(table,method='GET',query=None,body=None):
                  url=base+table+('?' + urlencode(query) if query else '')
                  req=Request(url,data=json.dumps(body,ensure_ascii=False).encode() if body is not None else None,headers=headers,method=method)
                  try:
                      with urlopen(req,timeout=60) as r: return json.loads(r.read())
                  except Exception as e:
                      raise RuntimeError(f'Supabase {table}: {type(e).__name__} {getattr(e,"code", "")}') from None
              def put(table,rows,conflict):
                  if not rows: return []
                  return api(table,'POST',{'on_conflict':conflict},rows)
              counts=Counter()
              stamp=datetime.now(timezone.utc).isoformat()
              for d,href in reports:
                  mid=d['meeting']; side=d['side']; home=d['home']; away=d['away']
                  event=dict(nuliga_match_id=mid,nuliga_group_id=d['group'],season='2026/27',competition_name=d['competition'],competition_type='cup' if d['group']=='211398' else 'league',event_date=datetime.strptime(d['date'],'%d.%m.%Y').date().isoformat(),event_time=d['event_time'],home_team=home,away_team=away,lions_team=home if side==1 else away,is_home_match=side==1,home_score=d['result'][0],away_score=d['result'][1],home_legs=d['legs'][0],away_legs=d['legs'][1],is_finished=True,is_approved=d['approved'],report_url=href,report_status='approved' if d['approved'] else 'provisional',raw_data=d,synced_at=stamp)
                  # Stable keys. Do not overwrite reconciliation columns or existing IDs.
                  eid=put('pc_nuliga_events',[event],'nuliga_match_id')[0]['id']
                  ms=[]
                  for n,m in enumerate(d['matches'],1):
                      a,b=m['legs']; x,y=m['result']
                      ms.append(dict(event_id=eid,match_number=n,match_type=m['type'],home_legs=a,away_legs=b,winner_side=1 if x>y else 2 if y>x else None,is_finished=True,raw_data=m,synced_at=stamp))
                  saved=put('pc_nuliga_matches',ms,'event_id,match_number'); ids={r['match_number']:r['id'] for r in saved}
                  ps=[]
                  for n,m in enumerate(d['matches'],1):
                      if m['type']=='team': continue
                      for i,group in enumerate(m['players']):
                          for j,p in enumerate(group):
                              ps.append(dict(match_id=ids[n],nuliga_person_id=p['person'],player_name=p['name'],player_side=i+1,player_position=j+1,is_home_player=i==0,won=m['result'][i]>m['result'][1-i],legs_won=m['legs'][i],legs_lost=m['legs'][1-i],raw_data=p,synced_at=stamp))
                  av=[dict(event_id=eid,nuliga_person_id=a['player']['person'],source_key=str(a['side'])+':'+a['player']['person'],player_name=a['player']['name'],player_side=a['side'],average=a['average'],average_type='matchday',raw_data=a,synced_at=stamp) for a in d['averages']]
                  hs={}
                  for h in d['highlights']:
                      pp=h['players']; single=len(pp)==1 and bool(pp[0]['person']); hs_side=1 if h['team']==home else 2 if h['team']==away else None
                      identity=','.join(sorted(p['person'] or p['name'] for p in pp)) or h['team']
                      sk=f"{h['type']}:{h['value']}:{hs_side}:{identity}"
                      if sk in hs: hs[sk]['highlight_count']+=h['count']; continue
                      hs[sk]=dict(event_id=eid,nuliga_person_id=pp[0]['person'] if single else None,player_name=' / '.join(p['name'] for p in pp) or None,team_name=h['team'],player_side=hs_side,highlight_type=h['type'],highlight_value=h['value'],highlight_count=h['count'],match_type='unknown',attribution='player' if single else 'team' if len(pp)>1 else 'unknown',source_key=sk,raw_data=h,synced_at=stamp)
                  for table,rows,conflict in [('pc_nuliga_players',ps,'match_id,player_side,player_position'),('pc_nuliga_averages',av,'event_id,source_key,average_type'),('pc_nuliga_highlights',list(hs.values()),'event_id,source_key')]:
                      put(table,rows,conflict); counts[table]+=len(rows)
                  counts['pc_nuliga_events']+=1; counts['pc_nuliga_matches']+=len(ms)
                  print('GESPEICHERT:',mid,'genehmigt:',d['approved'],flush=True)
              print('DATENBANK GESAMT:',json.dumps(dict(counts)))

          if __name__=='__main__':
              if len(sys.argv)>1:
                  for path in sys.argv[1:]: show(parse(BeautifulSoup(open(path,encoding='utf-8').read(),'html.parser')))
              else:
                  failures=0; tested=set(); aggregate=Counter(); found=set(); reports=[]
                  for group,team in GROUPS.items():
                      champ='Oberfranken+Pokal+26%2F27' if group=='211398' else 'OFr+2026%2F27'
                      url=WA+'groupPage?championship='+champ+'&group='+group+'&displayDetail=meetings&displayTyp=gesamt'
                      print('\n--- Spielplan:',team,group,'---')
                      try:
                          links=discover(fetch(url),url)
                          print('Lions-Spielberichtlinks:',len(links),sorted(links))
                          if not links: raise ValueError('Keine Lions-Spielberichtlinks gefunden')
                      except Exception as e:
                          failures+=1; print('SPIELPLAN-FEHLER:',str(e)); continue
                      found.update(links)
                      for mid,href in links.items():
                          if mid in tested: continue
                          tested.add(mid)
                          try:
                              d=parse(fetch(href))
                              if d['meeting']!=mid or d['group']!=group: raise ValueError('Falscher Spielbericht')
                              show(d)
                              reports.append((d,href))
                              if not d['approved']:
                                  aggregate['nicht_genehmigt']+=1
                                  print('Noch nicht genehmigt - separat gezaehlt')
                                  for m in d['matches']: aggregate['vorlaeufig_'+m['type']]+=1
                                  aggregate['vorlaeufig_highlights']+=len(d['highlights'])
                                  aggregate['vorlaeufig_averages']+=len(d['averages'])
                                  continue
                              aggregate['spielberichte']+=1
                              aggregate['heim' if d['side']==1 else 'auswaerts']+=1
                              aggregate.update(m['type'] for m in d['matches'])
                              aggregate['highlights']+=len(d['highlights'])
                              aggregate['averages']+=len(d['averages'])
                              print('Summenpruefung: OK')
                          except Exception as e:
                              failures+=1; print('BERICHT-FEHLER:',mid,type(e).__name__,str(e)); traceback.print_exc()
                  missing={'6106644','6106663','6114326'}-found
                  failures+=len(missing)
                  print('Fehlende Referenzberichte:',sorted(missing))
                  print('GESAMT:',json.dumps(dict(aggregate),ensure_ascii=False))
                  print('Gefundene Berichte:',len(found),'| Fehler:',failures)
                  if failures: sys.exit(1)
                  if os.environ.get('WRITE_DB')=='true': save_reports(reports)
                  else: print('Nur Lesemodus - keine Datenbankzugriffe')
          PYCODE
