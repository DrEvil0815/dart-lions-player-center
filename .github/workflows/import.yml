
name: Dart Lions Player Center - Import

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: player-center-import
  cancel-in-progress: false

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Darthelfer Einzelspielimport
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          python3 -u - <<'PY'
          import os
          import json
          import time
          import urllib.request
          import urllib.error
          from datetime import datetime, timezone
          from zoneinfo import ZoneInfo
          from collections import Counter

          BASE = "https://www.darthelfer.de/api/public"

          EVENT_IDS = [
              "bc54838c-ee15-40b9-9d5b-47638392cdf7",
              "4699f4b9-2e6c-43ea-a49f-397e8e646989",
              "bd1fc951-1fa2-4e00-8906-cb9baf46e0e6",
              "b6d3f9bc-afca-4890-a959-a2a611b2d533",
              "6940279d-e477-4753-90b5-19b9b809a051",
              "896e1093-f1c4-48f0-a099-e01a7e740572",
              "abeffda9-c0e4-447d-b580-8ded2957384b",
              "f37a7a7a-d816-4c6d-b1ad-ce209bc06751",
              "69bf7f0a-e17d-438e-8a9d-ecc95683ea10",
              "066baa4e-8ba7-4c87-a91f-f6a1c3e79474"
          ]

          URL = (
              os.environ["SUPABASE_URL"]
              .strip()
              .rstrip("/")
              .removesuffix("/rest/v1")
          )

          KEY = os.environ["SUPABASE_SERVICE_ROLE_KEY"].strip()

          if not URL or not KEY:
              raise RuntimeError("Supabase-Zugangsdaten fehlen")

          HEADERS = {
              "apikey": KEY,
              "Content-Type": "application/json",
              "Prefer": "resolution=merge-duplicates,return=representation"
          }

          if not KEY.startswith("sb_secret_"):
              HEADERS["Authorization"] = "Bearer " + KEY

          def now():
              return datetime.now(timezone.utc).isoformat()

          def timestamp(value):
              if not value:
                  return None

              dt = datetime.fromisoformat(
                  value.replace("Z", "+00:00")
              )

              if dt.tzinfo is None:
                  dt = dt.replace(
                      tzinfo=ZoneInfo("Europe/Berlin")
                  )

              return dt.isoformat()

          def request_json(
              url,
              data=None,
              headers=None,
              method="GET"
          ):
              req = urllib.request.Request(
                  url,
                  data=(
                      None if data is None
                      else json.dumps(data).encode("utf-8")
                  ),
                  headers=headers or {
                      "Accept": "application/json"
                  },
                  method=method
              )

              for attempt in range(3):
                  try:
                      with urllib.request.urlopen(
                          req, timeout=45
                      ) as response:

                          body = response.read()

                          return (
                              json.loads(body)
                              if body else None
                          )

                  except urllib.error.HTTPError as error:

                      if error.code not in (
                          429, 500, 502, 503, 504
                      ):
                          raise

                      if attempt == 2:
                          raise

                      time.sleep(3 * (attempt + 1))

                  except (urllib.error.URLError, TimeoutError):

                      if attempt == 2:
                          raise

                      time.sleep(3 * (attempt + 1))

          def upsert(table, data, conflict):

              try:
                  return request_json(
                      URL + "/rest/v1/" + table
                      + "?on_conflict=" + conflict,
                      data,
                      HEADERS,
                      "POST"
                  )

              except urllib.error.HTTPError as error:

                  print(
                      f"Datenbankfehler: {table}, "
                      f"HTTP {error.code}"
                  )

                  raise RuntimeError(
                      f"Speicherung in {table} fehlgeschlagen"
                  ) from None

          def patch(table, row_id, data):

              return request_json(
                  URL + "/rest/v1/" + table
                  + "?id=eq." + row_id,
                  data,
                  HEADERS,
                  "PATCH"
              )

          totals = {
              "events": 0,
              "matches": 0,
              "players": 0,
              "legs": 0,
              "throws": 0,
              "doubles": 0,
              "missing": 0,
              "unclear": 0,
              "historical": 0,
              "duplicates": 0,
              "skipped_events": 0
          }

          reasons = Counter()

          def unclear(reason, match_id):

              totals["unclear"] += 1
              reasons[reason] += 1

              print(
                  f"Match übersprungen: {match_id} | {reason}"
              )

          def doubles(reason, match_id):

              totals["doubles"] += 1

              print(
                  f"Doppel ausgeschlossen: {match_id} | {reason}"
              )

          def is_double_player(info):

              return bool(
                  info.get("doppelspieler")
                  or info.get("doppelpartnerId")
                  or info.get("idShortDoppel")
                  or info.get("idShortSinglePlayer1")
                  or info.get("idShortSinglePlayer2")
              )

          def collect_players(tournament, lookup):

              for key in (
                  "turnierMain",
                  "turnierGruppe",
                  "turnierKO",
                  "turnierGold",
                  "turnierBronze",
                  "turnierSilber"
              ):

                  part = tournament.get(key) or {}

                  for field in (
                      "tournamentPlayerEntities",
                      "playersSortedByTime",
                      "ranglistePlayerEntities"
                  ):

                      for p in part.get(field) or []:

                          if p.get("id"):

                              current = lookup.setdefault(
                                  p["id"], {}
                              )

                              current.update({
                                  k: v
                                  for k, v in p.items()
                                  if v is not None
                              })

          def import_event(event_id):

              matches_before = totals["matches"]
              unclear_before = totals["unclear"]

              tournament = request_json(
                  BASE + "/tournament/" + event_id
              )

              main = (
                  tournament.get("turnierMain")
                  or tournament.get("turnierGruppe")
                  or {}
              )

              group = (
                  tournament.get("turnierGruppe")
                  or main
              )

              if not main:
                  raise RuntimeError(
                      "Turnierstruktur nicht erkannt"
                  )

              name = (
                  group.get("bezeichnung")
                  or main.get("bezeichnung")
              )

              if not name:
                  raise RuntimeError(
                      "Veranstaltungsname fehlt"
                  )

              print("------------------------------")
              print(name)

              if (
                  main.get("doppelturnier")
                  or group.get("doppelturnier")
                  or main.get("dyp")
                  or group.get("dyp")
              ):

                  print("Doppelturnier ausgeschlossen")
                  totals["skipped_events"] += 1
                  return

              if "test" in name.lower():

                  print("Testveranstaltung ausgeschlossen")
                  totals["skipped_events"] += 1
                  return

              league = (
                  main.get("turniersystem") == "LIGASPIELTAG"
                  or group.get("turniersystem") == "LIGASPIELTAG"
              )

              if league:
                  event_type = "league"

              elif "competition" in name.lower():
                  event_type = "competition"

              elif "training" in name.lower():
                  event_type = "training"

              else:
                  event_type = "tournament"

              finished = (
                  main.get("tournamentstatus") == "abgeschlossen"
                  or group.get("tournamentstatus") == "abgeschlossen"
              )

              if not finished:

                  print(
                      "Nicht abgeschlossene Veranstaltung "
                      "übersprungen"
                  )

                  totals["skipped_events"] += 1
                  return

              player_lookup = {}

              collect_players(
                  tournament,
                  player_lookup
              )

              child_ids = set()

              for part in (main, group):

                  for field in (
                      "goldTurnierId",
                      "silberTurnierId",
                      "bronzeTurnierId"
                  ):

                      child_id = part.get(field)

                      if child_id and child_id != event_id:
                          child_ids.add(child_id)

              checked_children = set()

              def load_child(source_id):

                  if (
                      source_id == event_id
                      or source_id in checked_children
                  ):
                      return

                  checked_children.add(source_id)

                  try:

                      child = request_json(
                          BASE + "/tournament/" + source_id
                      )

                      collect_players(
                          child,
                          player_lookup
                      )

                  except (
                      urllib.error.HTTPError,
                      urllib.error.URLError,
                      TimeoutError
                  ):

                      print(
                          "Unterturnier-Spielerliste "
                          f"nicht verfügbar: {source_id}"
                      )

              for child_id in sorted(child_ids):
                  load_child(child_id)

              if league:

                  games = (
                      main.get("tournamentLeagueGameEntities")
                      or group.get("tournamentLeagueGameEntities")
                      or []
                  )

              else:

                  games = (
                      tournament.get("tournamentGames")
                      or []
                  )

              print(f"Matchreferenzen: {len(games)}")

              date_string = (
                  group.get("beginnString")
                  or main.get("beginnString")
              )

              event = upsert(
                  "pc_events",
                  {
                      "darthelfer_event_id": event_id,
                      "event_name": name,
                      "event_type": event_type,
                      "event_date": datetime.strptime(
                          date_string,
                          "%d.%m.%Y"
                      ).date().isoformat(),
                      "is_finished": True,
                      "home_team": main.get("mannschaftHeim"),
                      "away_team": main.get("mannschaftGast"),
                      "synced_at": now()
                  },
                  "darthelfer_event_id"
              )[0]

              totals["events"] += 1

              seen = set()
              seen_archives = set()

              for ref in games:

                  match_id = (
                      ref.get("tournamentGameId")
                      or ref.get("id")
                  )

                  source_id = (
                      ref.get("tournamentId")
                      or event_id
                  )

                  if not match_id:

                      unclear(
                          "Match-ID fehlt",
                          "unbekannt"
                      )

                      continue

                  if league and ref.get("type") != "EZ":

                      if ref.get("type") == "DP":

                          doubles(
                              "Liga-Doppelspiel",
                              match_id
                          )

                      else:

                          unclear(
                              "Unbekannter Liga-Spieltyp",
                              match_id
                          )

                      continue

                  if ref.get("type") == "DP":

                      doubles(
                          "Doppelspiel",
                          match_id
                      )

                      continue

                  if any(
                      value
                      for key, value in ref.items()
                      if key.lower().startswith(
                          "doppelpartner"
                      )
                  ):

                      doubles(
                          "Doppelpartner vorhanden",
                          match_id
                      )

                      continue

                  identity = (
                      ref.get("gameId")
                      or (source_id, match_id)
                  )

                  if identity in seen:

                      totals["duplicates"] += 1
                      continue

                  seen.add(identity)

                  archive_url = (
                      BASE + "/gameausarchiv/x01/"
                      + source_id + "/"
                      + match_id
                      + "/tournamentgameid"
                  )

                  try:

                      archive = request_json(
                          archive_url
                      )

                  except urllib.error.HTTPError as error:

                      if error.code == 404:

                          totals["missing"] += 1

                          print(
                              f"Archiv fehlt: {match_id}"
                          )

                          continue

                      raise

                  if not archive or not archive.get("gameid"):

                      totals["missing"] += 1

                      print(
                          f"Archiv leer: {match_id}"
                      )

                      continue

                  if archive["gameid"] in seen_archives:

                      totals["duplicates"] += 1
                      continue

                  player1_id = archive.get("player1Id")
                  player2_id = archive.get("player2Id")
                  winner_id = archive.get("gewonnenPlayerid")

                  if (
                      not player1_id
                      or not player2_id
                      or player1_id == player2_id
                  ):

                      unclear(
                          "Spieler-IDs fehlen oder sind identisch",
                          match_id
                      )

                      continue

                  completed = bool(
                      winner_id
                      and winner_id in (
                          player1_id,
                          player2_id
                      )
                  ) or archive.get("unentschieden") is True

                  details1 = (
                      archive.get("gameDetailsPlayer1")
                      or []
                  )

                  details2 = (
                      archive.get("gameDetailsPlayer2")
                      or []
                  )

                  legs_completed = bool(
                      details1 and details2
                  ) and all(
                      leg.get("abgeschlossen") is True
                      for leg in details1 + details2
                  )

                  if not completed:

                      unclear(
                          "Matchabschluss nicht eindeutig",
                          match_id
                      )

                      continue

                  if not legs_completed:

                      unclear(
                          "Legs fehlen oder sind nicht abgeschlossen",
                          match_id
                      )

                      continue

                  load_child(source_id)

                  sides = []

                  for side in (1, 2):

                      player_id = archive.get(
                          f"player{side}Id"
                      )

                      stat = (
                          archive.get(
                              f"player{side}Statistik"
                          )
                          or {}
                      )

                      details = (
                          archive.get(
                              f"gameDetailsPlayer{side}"
                          )
                          or []
                      )

                      info = player_lookup.get(
                          player_id, {}
                      )

                      sides.append(
                          (
                              side,
                              player_id,
                              stat,
                              details,
                              info
                          )
                      )

                  if any(
                      is_double_player(info)
                      or stat.get("doppelpartnerid")
                      or "/" in (
                          archive.get(f"player{side}Name")
                          or ""
                      )
                      or any(
                          d.get("doppelpartnerId")
                          or d.get("anwurfDoppelPlayerId")
                          for d in details
                      )
                      for side, pid, stat, details, info
                      in sides
                  ):

                      doubles(
                          "Doppelkennzeichnung im Archiv",
                          match_id
                      )

                      continue

                  if not all(
                      pid and stat and details
                      for side, pid, stat, details, info
                      in sides
                  ):

                      unclear(
                          "Spielerstatistiken fehlen",
                          match_id
                      )

                      continue

                  explicit_singles = all(
                      info.get("einzelspieler") is True
                      for side, pid, stat, details, info
                      in sides
                  )

                  single_event = (
                      not league
                      and main.get("doppelturnier") is False
                      and group.get("doppelturnier") is False
                      and not main.get("dyp")
                      and not group.get("dyp")
                      and not main.get("optionalTeamGame")
                      and not group.get("optionalTeamGame")
                      and not any(
                          info.get("einzelspieler") is False
                          for side, pid, stat, details, info
                          in sides
                      )
                  )

                  if not (
                      (league and ref.get("type") == "EZ")
                      or explicit_singles
                      or single_event
                  ):

                      unclear(
                          "Einzelspiel nicht eindeutig bestätigt",
                          match_id
                      )

                      continue

                  consistent_players = all(
                      stat.get("playerid") == pid
                      and all(
                          d.get("playerid") == pid
                          for d in details
                      )
                      for side, pid, stat, details, info
                      in sides
                  )

                  if not consistent_players:

                      unclear(
                          "Spielerzuordnung im Archiv widersprüchlich",
                          match_id
                      )

                      continue

                  scores = {
                      item["gamedetailId"]: (
                          item.get("scores") or []
                      )
                      for item in archive.get("scores") or []
                  }

                  if not scores:

                      unclear(
                          "Aufnahmedaten fehlen",
                          match_id
                      )

                      continue

                  historical = not archive.get(
                      "endezeitpunkt"
                  )

                  match = upsert(
                      "pc_matches",
                      {
                          "event_id": event["id"],
                          "darthelfer_match_id": match_id,
                          "darthelfer_game_id": archive["gameid"],
                          "source_tournament_id": source_id,
                          "match_type": "singles",
                          "played_at": timestamp(
                              archive.get("startzeitpunkt")
                          ),
                          "started_at": (
                              timestamp(
                                  archive.get("startzeitpunkt")
                              )
                              if not historical else None
                          ),
                          "finished_at": timestamp(
                              archive.get("endezeitpunkt")
                          ),
                          "duration_minutes": archive.get(
                              "dauer"
                          ),
                          "is_finished": True,
                          "archive_available": True,
                          "raw_data": archive,
                          "synced_at": now()
                      },
                      "event_id,darthelfer_match_id"
                  )[0]

                  for side, player_id, stat, details, info in sides:

                      attempts = stat.get(
                          "anzahlDoppelwuerfe"
                      )

                      double_known = (
                          attempts is not None
                          and attempts > 0
                      )

                      highs = stat.get("highscores")

                      finishes = []
                      leg_lengths = []

                      for detail in details:

                          if not detail.get("gewonnen"):
                              continue

                          if not detail.get("abgeschlossen"):
                              continue

                          if detail.get("wuerfe"):

                              leg_lengths.append(
                                  detail["wuerfe"]
                              )

                          for score in scores.get(
                              detail["id"], []
                          ):

                              if (
                                  score.get("scoregueltig") is True
                                  and score.get("togo") == 0
                                  and score.get("aufnahme") is not None
                              ):

                                  finishes.append(
                                      score["aufnahme"]
                                  )

                      highfinishes = (
                          stat.get("highfinishes")
                          or []
                      )

                      finishes.extend(
                          n for n in highfinishes
                          if isinstance(n, (int, float))
                          and 0 < n <= 170
                      )

                      player_name = " ".join(
                          (
                              archive.get(
                                  f"player{side}Name"
                              )
                              or info.get("name")
                              or "Unbekannt"
                          ).split()
                      )

                      player = upsert(
                          "pc_match_players",
                          {
                              "match_id": match["id"],
                              "darthelfer_player_id": player_id,
                              "darthelfer_user_id": (
                                  stat.get("userid")
                                  or info.get("userId")
                              ),
                              "nuliga_person_id": info.get(
                                  "externPersonId"
                              ),
                              "nuliga_player_id": info.get(
                                  "externPlayerId"
                              ),
                              "is_home_player": (
                                  info.get("heimmannschaft")
                                  if league else None
                              ),
                              "player_name": player_name,
                              "player_side": side,
                              "won": (
                                  winner_id == player_id
                                  if winner_id else None
                              ),
                              "legs_won": stat.get(
                                  "gewonneneLegs"
                              ),
                              "legs_lost": stat.get(
                                  "verloreneLegs"
                              ),
                              "scored_points": stat.get(
                                  "anzahlGeworfenerPunkteGesamt"
                              ),
                              "darts_thrown": stat.get(
                                  "anzahlWuerfeGesamt"
                              ),
                              "average": stat.get(
                                  "average"
                              ),
                              "first9_average": stat.get(
                                  "first9Average"
                              ),
                              "first12_average": stat.get(
                                  "first12Average"
                              ),
                              "first15_average": stat.get(
                                  "first15Average"
                              ),
                              "first9_points": stat.get(
                                  "anzahlGeworfenerPunkteFirst9"
                              ),
                              "first9_darts": stat.get(
                                  "anzahlWuerfeFirst9"
                              ),
                              "first12_points": stat.get(
                                  "anzahlGeworfenerPunkteFirst12"
                              ),
                              "first12_darts": stat.get(
                                  "anzahlWuerfeFirst12"
                              ),
                              "first15_points": stat.get(
                                  "anzahlGeworfenerPunkteFirst15"
                              ),
                              "first15_darts": stat.get(
                                  "anzahlWuerfeFirst15"
                              ),
                              "count_100": (
                                  sum(
                                      100 <= n < 140
                                      for n in highs
                                  )
                                  if highs is not None
                                  else None
                              ),
                              "count_140": (
                                  sum(
                                      140 <= n < 180
                                      for n in highs
                                  )
                                  if highs is not None
                                  else None
                              ),
                              "count_180": stat.get(
                                  "_180er"
                              ),
                              "highest_finish": max(
                                  finishes,
                                  default=None
                              ),
                              "shortest_leg": min(
                                  leg_lengths,
                                  default=None
                              ),
                              "longest_leg": max(
                                  leg_lengths,
                                  default=None
                              ),
                              "double_attempts": (
                                  attempts
                                  if double_known
                                  else None
                              ),
                              "double_hits": (
                                  stat.get(
                                      "anzahlDoppelgetroffen"
                                  )
                                  if double_known
                                  else None
                              ),
                              "double_percentage": (
                                  stat.get("doppelquote")
                                  if double_known
                                  else None
                              ),
                              "raw_data": stat
                          },
                          "match_id,darthelfer_player_id"
                      )[0]

                      totals["players"] += 1

                      for detail in details:

                          visits = scores.get(
                              detail["id"], []
                          )

                          checkout = next(
                              (
                                  s["aufnahme"]
                                  for s in visits
                                  if s.get("scoregueltig") is True
                                  and s.get("togo") == 0
                                  and s.get("aufnahme") is not None
                                  and detail.get("gewonnen") is True
                                  and detail.get("abgeschlossen") is True
                              ),
                              None
                          )

                          leg = upsert(
                              "pc_legs",
                              {
                                  "match_player_id": player["id"],
                                  "darthelfer_detail_id": detail["id"],
                                  "set_number": (
                                      detail.get("setNumber")
                                      or 1
                                  ),
                                  "leg_number": detail["leg"],
                                  "won": detail.get(
                                      "gewonnen"
                                  ),
                                  "scored_points": detail.get(
                                      "anzahlGeworfenerPunkte"
                                  ),
                                  "darts_thrown": detail.get(
                                      "wuerfe"
                                  ),
                                  "average": detail.get(
                                      "average"
                                  ),
                                  "first9_average": detail.get(
                                      "first9Average"
                                  ),
                                  "checkout": checkout,
                                  "double_attempts": detail.get(
                                      "anzahlDoppelwuerfe"
                                  ),
                                  "raw_data": detail
                              },
                              "darthelfer_detail_id"
                          )[0]

                          totals["legs"] += 1

                          remaining = None
                          records = []

                          for score in visits:

                              if score.get("id") is None:

                                  remaining = score.get(
                                      "togo"
                                  )

                                  continue

                              records.append({
                                  "leg_id": leg["id"],
                                  "darthelfer_score_id": score["id"],
                                  "visit_number": len(records) + 1,
                                  "points": score.get("aufnahme"),
                                  "remaining_before": remaining,
                                  "remaining_after": score.get("togo"),
                                  "darts_used": score.get("anzahlWuerfe"),
                                  "dart1": score.get("wurf1"),
                                  "dart2": score.get("wurf2"),
                                  "dart3": score.get("wurf3"),
                                  "double_attempts": score.get(
                                      "anzahlDoppelwuerfe"
                                  ),
                                  "is_valid": score.get(
                                      "scoregueltig"
                                  ),
                                  "is_checkout": (
                                      score.get("togo") == 0
                                      and score.get("scoregueltig") is True
                                      and detail.get("gewonnen") is True
                                      and detail.get("abgeschlossen") is True
                                  ),
                                  "raw_data": score
                              })

                              remaining = score.get("togo")

                          if records:

                              upsert(
                                  "pc_throws",
                                  records,
                                  "leg_id,visit_number"
                              )

                              totals["throws"] += len(
                                  records
                              )

                  seen_archives.add(
                      archive["gameid"]
                  )

                  totals["matches"] += 1

                  if historical:
                      totals["historical"] += 1

                  print(
                      f"Einzelmatches importiert: "
                      f"{totals['matches']}"
                  )

                  time.sleep(0.3)

              print(
                  f"Veranstaltung abgeschlossen: {name}"
              )

              print(
                  f"Importierte Matches: "
                  f"{totals['matches'] - matches_before}"
              )

              print(
                  f"Unklare Matches: "
                  f"{totals['unclear'] - unclear_before}"
              )

          print("=" * 60)
          print("DART LIONS PLAYER CENTER")
          print("HISTORISCHER EINZELSPIELIMPORT")
          print("=" * 60)

          log = request_json(
              URL + "/rest/v1/pc_sync_log",
              {"status": "running"},
              HEADERS,
              "POST"
          )[0]

          try:

              for event_id in EVENT_IDS:

                  import_event(event_id)

              incomplete = bool(
                  totals["missing"]
                  or totals["unclear"]
                  or totals["skipped_events"]
                  or not totals["matches"]
              )

              patch(
                  "pc_sync_log",
                  log["id"],
                  {
                      "finished_at": now(),
                      "status": (
                          "partial"
                          if incomplete
                          else "success"
                      ),
                      "events_imported": totals["events"],
                      "matches_imported": totals["matches"],
                      "error_message": (
                          f"Fehlende Archive: {totals['missing']}, "
                          f"Unklare Matches: {totals['unclear']}, "
                          f"Übersprungene Events: {totals['skipped_events']}, "
                          f"Gründe: {dict(reasons)}"
                          if incomplete else None
                      )
                  }
              )

          except Exception as error:

              patch(
                  "pc_sync_log",
                  log["id"],
                  {
                      "finished_at": now(),
                      "status": "failed",
                      "events_imported": totals["events"],
                      "matches_imported": totals["matches"],
                      "error_message": type(error).__name__
                  }
              )

              raise

          print("=" * 60)
          print("IMPORT ABGESCHLOSSEN")
          print("=" * 60)

          print(
              f"Veranstaltungen: {totals['events']}"
          )

          print(
              f"Einzelmatches: {totals['matches']}"
          )

          print(
              f"Spielerstatistiken: {totals['players']}"
          )

          print(
              f"Legstatistiken: {totals['legs']}"
          )

          print(
              f"Aufnahmen: {totals['throws']}"
          )

          print(
              f"Historische Matches ohne Endzeit: "
              f"{totals['historical']}"
          )

          print(
              f"Doppel ausgeschlossen: {totals['doubles']}"
          )

          print(
              f"Doppelte Referenzen: {totals['duplicates']}"
          )

          print(
              f"Fehlende Archive: {totals['missing']}"
          )

          print(
              f"Unklare Matches: {totals['unclear']}"
          )

          print(
              f"Übersprungene Veranstaltungen: "
              f"{totals['skipped_events']}"
          )

          if reasons:

              print("------------------------------")
              print("GRÜNDE FÜR ÜBERSPRUNGENE MATCHES")

              for reason, count in reasons.most_common():

                  print(f"{reason}: {count}")

          print("=" * 60)

          if not totals["matches"]:

              raise RuntimeError(
                  "Keine Einzelmatches importiert"
              )

          print(
              "TEILIMPORT"
              if incomplete
              else "IMPORT ERFOLGREICH"
          )

          print("GAME ON!")
          PY
