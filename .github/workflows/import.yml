
name: Dart Lions Player Center - Import

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: player-center-import
  cancel-in-progress: false

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Darthelfer Matchimport
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          python3 - <<'PY'
          import os
          import json
          import time
          import urllib.request
          import urllib.error

          from datetime import datetime, timezone
          from zoneinfo import ZoneInfo

          BASE = "https://www.darthelfer.de/api/public"

          EVENT_ID = "cb3ed76e-935b-4f38-835c-f91eab283776"

          SUPABASE_URL = (
              os.environ["SUPABASE_URL"]
              .strip()
              .rstrip("/")
              .removesuffix("/rest/v1")
          )

          KEY = os.environ["SUPABASE_SERVICE_ROLE_KEY"].strip()

          if not SUPABASE_URL or not KEY:
              raise RuntimeError("Supabase-Zugangsdaten fehlen")

          HEADERS = {
              "apikey": KEY,
              "Content-Type": "application/json",
              "Prefer": "resolution=merge-duplicates,return=representation"
          }

          if not KEY.startswith("sb_secret_"):
              HEADERS["Authorization"] = "Bearer " + KEY

          def now():
              return datetime.now(timezone.utc).isoformat()

          def timestamp(value):
              if not value:
                  return None
              dt = datetime.fromisoformat(value.replace("Z", "+00:00"))
              if dt.tzinfo is None:
                  dt = dt.replace(tzinfo=ZoneInfo("Europe/Berlin"))
              return dt.isoformat()

          def request_json(url, data=None, headers=None, method="GET"):
              request = urllib.request.Request(
                  url,
                  data=None if data is None else json.dumps(data).encode(),
                  headers=headers or {"Accept": "application/json"},
                  method=method
              )

              with urllib.request.urlopen(request, timeout=40) as response:
                  body = response.read()
                  return json.loads(body) if body else None

          def upsert(table, data, conflict):
              url = (
                  SUPABASE_URL + "/rest/v1/" + table
                  + "?on_conflict=" + conflict
              )
              try:
                  return request_json(url, data, HEADERS, "POST")
              except urllib.error.HTTPError as error:
                  print(f"Datenbankfehler: {table}, HTTP {error.code}")
                  raise RuntimeError(
                      f"Speicherung in {table} fehlgeschlagen"
                  ) from None

          print("DART LIONS PLAYER CENTER")
          print("Starte Matchimport")

          tournament = request_json(
              BASE + "/tournament/" + EVENT_ID
          )

          group = tournament["turnierGruppe"]

          event = upsert(
              "pc_events",
              {
                  "darthelfer_event_id": EVENT_ID,
                  "event_name": group["bezeichnung"],
                  "event_type": "competition",
                  "event_date": datetime.strptime(
                      group["beginnString"], "%d.%m.%Y"
                  ).date().isoformat(),
                  "is_finished": True,
                  "synced_at": now()
              },
              "darthelfer_event_id"
          )[0]

          event_db_id = event["id"]

          games = tournament.get("tournamentGames") or []

          print(f"Archiv-Matchreferenzen: {len(games)}")

          totals = {
              "matches": 0,
              "players": 0,
              "legs": 0,
              "throws": 0,
              "missing": 0
          }

          seen = set()

          for reference in games:

              game_id = reference.get("gameId")
              match_id = reference.get("tournamentGameId")
              source_id = reference.get("tournamentId")

              if not match_id or not source_id:
                  continue

              identity = game_id or (source_id, match_id)

              if identity in seen:
                  continue

              seen.add(identity)

              archive_url = (
                  BASE + "/gameausarchiv/x01/"
                  + source_id + "/"
                  + match_id + "/tournamentgameid"
              )

              try:
                  archive = request_json(archive_url)

              except urllib.error.HTTPError as error:
                  if error.code == 404:
                      totals["missing"] += 1
                      print("Archiv nicht verfügbar")
                      continue
                  raise

              if not archive or not archive.get("gameid"):
                  totals["missing"] += 1
                  continue

              scores = {
                  item["gamedetailId"]: item.get("scores", [])
                  for item in archive.get("scores", [])
              }

              match = upsert(
                  "pc_matches",
                  {
                      "event_id": event_db_id,
                      "darthelfer_match_id": match_id,
                      "darthelfer_game_id": archive["gameid"],
                      "source_tournament_id": source_id,
                      "match_type": "singles",
                      "played_at": timestamp(
                          archive.get("startzeitpunkt")
                      ),
                      "started_at": timestamp(
                          archive.get("startzeitpunkt")
                      ),
                      "finished_at": timestamp(
                          archive.get("endezeitpunkt")
                      ),
                      "duration_minutes": archive.get("dauer"),
                      "is_finished": bool(
                          archive.get("endezeitpunkt")
                      ),
                      "archive_available": True,
                      "raw_data": archive,
                      "synced_at": now()
                  },
                  "event_id,darthelfer_match_id"
              )[0]

              totals["matches"] += 1

              for side in (1, 2):

                  stat = archive.get(
                      f"player{side}Statistik"
                  ) or {}

                  details = archive.get(
                      f"gameDetailsPlayer{side}"
                  ) or []

                  player_id = archive.get(f"player{side}Id")

                  if not player_id:
                      continue

                  attempts = stat.get("anzahlDoppelwuerfe")

                  double_known = (
                      attempts is not None and attempts > 0
                  )

                  winning_legs = [
                      leg for leg in details
                      if leg.get("gewonnen") is True
                      and leg.get("abgeschlossen") is True
                  ]

                  leg_lengths = [
                      leg["wuerfe"] for leg in winning_legs
                      if leg.get("wuerfe")
                  ]

                  finishes = []

                  for leg in winning_legs:
                      for score in scores.get(leg["id"], []):
                          if (
                              score.get("scoregueltig") is True
                              and score.get("togo") == 0
                              and score.get("aufnahme") is not None
                          ):
                              finishes.append(score["aufnahme"])

                  highs = stat.get("highscores")

                  player = upsert(
                      "pc_match_players",
                      {
                          "match_id": match["id"],
                          "darthelfer_player_id": player_id,
                          "darthelfer_user_id": stat.get("userid"),
                          "player_name": archive.get(f"player{side}Name"),
                          "player_side": side,
                          "won": (
                              archive.get("gewonnenPlayerid") == player_id
                              if archive.get("gewonnenPlayerid")
                              else None
                          ),
                          "legs_won": stat.get("gewonneneLegs"),
                          "legs_lost": stat.get("verloreneLegs"),
                          "scored_points": stat.get("anzahlGeworfenerPunkteGesamt"),
                          "darts_thrown": stat.get("anzahlWuerfeGesamt"),
                          "average": stat.get("average"),
                          "first9_average": stat.get("first9Average"),
                          "first12_average": stat.get("first12Average"),
                          "first15_average": stat.get("first15Average"),
                          "first9_points": stat.get("anzahlGeworfenerPunkteFirst9"),
                          "first9_darts": stat.get("anzahlWuerfeFirst9"),
                          "first12_points": stat.get("anzahlGeworfenerPunkteFirst12"),
                          "first12_darts": stat.get("anzahlWuerfeFirst12"),
                          "first15_points": stat.get("anzahlGeworfenerPunkteFirst15"),
                          "first15_darts": stat.get("anzahlWuerfeFirst15"),
                          "count_100": (
                              sum(100 <= n < 140 for n in highs)
                              if highs is not None else None
                          ),
                          "count_140": (
                              sum(140 <= n < 180 for n in highs)
                              if highs is not None else None
                          ),
                          "count_180": stat.get("_180er"),
                          "highest_finish": max(finishes, default=None),
                          "shortest_leg": min(leg_lengths, default=None),
                          "longest_leg": max(leg_lengths, default=None),
                          "double_attempts": attempts if double_known else None,
                          "double_hits": stat.get("anzahlDoppelgetroffen") if double_known else None,
                          "double_percentage": stat.get("doppelquote") if double_known else None,
                          "raw_data": stat
                      },
                      "match_id,darthelfer_player_id"
                  )[0]

                  totals["players"] += 1

                  for detail in details:

                      visits = scores.get(detail["id"], [])

                      checkout = next(
                          (
                              s["aufnahme"]
                              for s in visits
                              if s.get("scoregueltig") is True
                              and s.get("togo") == 0
                              and s.get("aufnahme") is not None
                              and detail.get("gewonnen") is True
                          ),
                          None
                      )

                      leg = upsert(
                          "pc_legs",
                          {
                              "match_player_id": player["id"],
                              "darthelfer_detail_id": detail["id"],
                              "set_number": detail.get("setNumber") or 1,
                              "leg_number": detail["leg"],
                              "won": detail.get("gewonnen"),
                              "scored_points": detail.get("anzahlGeworfenerPunkte"),
                              "darts_thrown": detail.get("wuerfe"),
                              "average": detail.get("average"),
                              "first9_average": detail.get("first9Average"),
                              "checkout": checkout,
                              "double_attempts": detail.get("anzahlDoppelwuerfe"),
                              "raw_data": detail
                          },
                          "darthelfer_detail_id"
                      )[0]

                      totals["legs"] += 1

                      remaining = None
                      visit_number = 0
                      records = []

                      for score in visits:

                          if score.get("id") is None:
                              remaining = score.get("togo")
                              continue

                          visit_number += 1

                          records.append({
                              "leg_id": leg["id"],
                              "darthelfer_score_id": score["id"],
                              "visit_number": visit_number,
                              "points": score.get("aufnahme"),
                              "remaining_before": remaining,
                              "remaining_after": score.get("togo"),
                              "darts_used": score.get("anzahlWuerfe"),
                              "dart1": score.get("wurf1"),
                              "dart2": score.get("wurf2"),
                              "dart3": score.get("wurf3"),
                              "double_attempts": score.get("anzahlDoppelwuerfe"),
                              "is_valid": score.get("scoregueltig"),
                              "is_checkout": (
                                  score.get("togo") == 0
                                  and score.get("scoregueltig") is True
                                  and detail.get("gewonnen") is True
                              ),
                              "raw_data": score
                          })

                          remaining = score.get("togo")

                      if records:
                          upsert(
                              "pc_throws",
                              records,
                              "leg_id,visit_number"
                          )

                          totals["throws"] += len(records)

              print(f"Matches verarbeitet: {totals['matches']}")

              time.sleep(0.3)

          print("------------------------------")
          print("IMPORT ABGESCHLOSSEN")
          print(f"Matches: {totals['matches']}")
          print(f"Spieler-Matchdatensätze: {totals['players']}")
          print(f"Spieler-Legdatensätze: {totals['legs']}")
          print(f"Aufnahmen: {totals['throws']}")
          print(f"Fehlende Archive: {totals['missing']}")
          print("GAME ON!")
          PY
