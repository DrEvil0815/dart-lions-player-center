name: Player Center - nuLiga Historischer Erstimport

on:
  workflow_dispatch:
    inputs:
      write_import:
        description: "Daten wirklich in Supabase speichern (sonst Testlauf)"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Python vorbereiten
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: HTML Parser installieren
        run: python -m pip install beautifulsoup4==4.13.4
      - name: Historische Spielberichte untersuchen
        env:
          WRITE_IMPORT: ${{ inputs.write_import }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          python -u - <<'PY'
          import os
          import re
          import json
          import time

          from collections import deque
          from urllib.request import Request, urlopen
          from urllib.parse import (
              urlencode,
              urljoin,
              urlparse,
              parse_qs
          )
          from bs4 import BeautifulSoup


          HOST = "bdv-dart.liga.nu"

          BASE = (
              "https://" + HOST +
              "/cgi-bin/WebObjects/"
              "nuLigaDARTDE.woa/wa/"
          )

          CLUB = "6042"
          START_SEASON = "2026/27"

          SUPABASE_URL = os.environ[
              "SUPABASE_URL"
          ].strip().rstrip("/")

          SUPABASE_KEY = os.environ[
              "SUPABASE_SERVICE_ROLE_KEY"
          ].strip()

          if SUPABASE_URL.endswith("/rest/v1"):
              SUPABASE_URL = SUPABASE_URL[:-8]

          REST = SUPABASE_URL + "/rest/v1/"


          def txt(element):
              return " ".join(element.stripped_strings)


          def database_rows(table, parameters):

              rows = []
              offset = 0
              limit = 500

              while True:

                  query = dict(parameters)

                  query["limit"] = limit
                  query["offset"] = offset

                  url = (
                      REST + table + "?" +
                      urlencode(query)
                  )

                  request = Request(
                      url,
                      headers={
                          "apikey": SUPABASE_KEY,
                          "Authorization":
                              "Bearer " + SUPABASE_KEY,
                          "Accept": "application/json"
                      }
                  )

                  with urlopen(
                      request,
                      timeout=45
                  ) as response:

                      part = json.loads(
                          response.read()
                      )

                  if not isinstance(part, list):
                      raise RuntimeError(
                          "Unerwartete Datenbankantwort"
                      )

                  rows.extend(part)

                  if len(part) < limit:
                      break

                  offset += len(part)

              return rows


          def fetch(url):

              if urlparse(url).hostname != HOST:
                  raise RuntimeError(
                      "Unbekannter Host"
                  )

              time.sleep(1)

              request = Request(
                  url,
                  headers={
                      "User-Agent":
                          "Dart Lions Player Center/2.3",
                      "Accept": "text/html"
                  }
              )

              with urlopen(
                  request,
                  timeout=45
              ) as response:

                  final_url = response.geturl()

                  if urlparse(final_url).hostname != HOST:
                      raise RuntimeError(
                          "Unbekanntes Weiterleitungsziel"
                      )

                  soup = BeautifulSoup(
                      response.read(),
                      "html.parser"
                  )

              content = soup.select_one("#content")

              if content is None:
                  raise RuntimeError(
                      "Seiteninhalt fehlt"
                  )

              return content, final_url


          def parameters(url):

              return {
                  key: values[0]

                  for key, values in parse_qs(
                      urlparse(url).query
                  ).items()

                  if len(values) == 1
              }


          def portrait_key(url):

              p = parameters(url)

              return (
                  p.get("federation", "BDV"),
                  p.get("person", ""),
                  p.get("season", ""),
                  p.get("club", ""),
                  p.get("mode", "")
              )


          def season_info(value, heading=""):

              combined = value + " " + heading

              match = re.search(
                  r"(\d{4}|\d{2})/(\d{2,4})",
                  combined
              )

              if not match:
                  raise RuntimeError(
                      "Spielzeit nicht erkannt"
                  )

              start = int(match.group(1))

              if start < 100:
                  start += 2000

              end = int(match.group(2))

              if end < 100:
                  end += (start // 100) * 100

                  if end < start:
                      end += 100

              if end != start + 1:
                  raise RuntimeError(
                      "Ungültige Spielzeit"
                  )

              return {
                  "season":
                      f"{start}/{end % 100:02d}",

                  "competition_type": (
                      "cup"
                      if any(x in combined.lower() for x in ("pokal", "cup"))
                      else "league"
                  )
              }


          def find_row(content, *labels):

              def normalize(value):
                  return " ".join(value.split()).strip(":").casefold()

              labels = {normalize(label) for label in labels}

              for row in content.select("tr"):

                  cells = row.find_all(
                      ["td", "th"],
                      recursive=False
                  )

                  if (
                      len(cells) >= 2
                      and normalize(txt(cells[0])) in labels
                  ):
                      return row

              return None


          def discover_portrait(
              content,
              page_url,
              person_id
          ):

              current = parameters(page_url)

              if current.get("person") != person_id:
                  raise RuntimeError(
                      "Falsche Personen-ID"
                  )

              season_row = find_row(
                  content,
                  "Saisonen", "Saisons", "Seasons"
              )

              club_row = find_row(
                  content,
                  "Verein", "Club"
              )

              if season_row is None:
                  raise RuntimeError(
                      "Saisonübersicht fehlt"
                  )

              if club_row is None:
                  raise RuntimeError(
                      "Vereinsübersicht fehlt"
                  )

              club_links = club_row.select(
                  'a[href*="clubInfoDisplay"]'
              )

              clubs = {}

              for link in club_links:

                  href = urljoin(
                      page_url,
                      link["href"]
                  )

                  if urlparse(href).hostname != HOST:
                      continue

                  club_id = parameters(href).get(
                      "club"
                  )

                  if club_id:
                      clubs[club_id] = txt(link)

              if len(clubs) != 1:
                  raise RuntimeError(
                      "Verein nicht eindeutig erkannt"
                  )

              club_id, club_name = next(
                  iter(clubs.items())
              )

              if current.get("club") != club_id:
                  raise RuntimeError(
                      "Vereins-ID stimmt nicht überein"
                  )

              current_heading = ""

              for element in content.select(
                  "h1, h2, h3"
              ):

                  heading = txt(element)

                  if any(word in heading.casefold() for word in ("spielsaison", "season")):

                      current_heading = heading
                      break

              if not current_heading:
                  raise RuntimeError("Spielerportrait-Ueberschrift fehlt; Zugriff oder HTML pruefen")

              info = season_info(
                  current.get("season", ""),
                  current_heading
              )

              season_links = {}

              for link in season_row.select(
                  'a[href*="playerPortrait"]'
              ):

                  href = urljoin(
                      page_url,
                      link["href"]
                  )

                  if urlparse(href).hostname != HOST:
                      continue

                  p = parameters(href)

                  if p.get("person") != person_id:
                      continue

                  if not p.get("season"):
                      continue

                  season_links[
                      portrait_key(href)
                  ] = href

              reports = {}

              for link in content.select(
                  'a[href*="groupMeetingReport"]'
              ):

                  href = urljoin(
                      page_url,
                      link["href"]
                  )

                  if urlparse(href).hostname != HOST:
                      continue

                  p = parameters(href)

                  meeting_id = p.get("meeting")

                  if not meeting_id:
                      continue

                  if not meeting_id.isdigit():
                      continue

                  reports[meeting_id] = {
                      "meeting_id": meeting_id,
                      "championship": p.get(
                          "championship"
                      ),
                      "group_id": p.get("group"),
                      "report_url": href
                  }

              team_row = find_row(
                  content,
                  "Mannschaftsaufstellung", "Team Line-up", "Team lineup"
              )

              assignments_row = find_row(
                  content,
                  "Mannschaftseinsätze", "Team appearances"
              )

              item = {

                  "person_id": person_id,

                  "season": info["season"],

                  "source_season":
                      current.get("season"),

                  "competition_type":
                      info["competition_type"],

                  "club_id": club_id,

                  "club_name": club_name,

                  "is_dart_lions":
                      club_id == CLUB,

                  "team_assignment": (
                      txt(team_row)
                      if team_row else None
                  ),

                  "team_appearances": (
                      txt(assignments_row)
                      if assignments_row else None
                  ),

                  "report_count": len(reports),
                  "report_availability": "links_found" if reports else "no_links_not_verified",

                  "meeting_ids":
                      sorted(reports.keys()),

                  "portrait_url": page_url

              }

              return (
                  item,
                  season_links,
                  reports
              )


          print("=" * 60)
          print("DART LIONS PLAYER CENTER")
          print("HISTORISCHE SPIELERKARRIEREN V1.1")
          print("=" * 60)


          members = database_rows(
              "pc_members",
              {
                  "select":
                      "id,member_number,"
                      "first_name,last_name,is_active",

                  "order": "member_number.asc"
              }
          )


          identities = database_rows(
              "pc_player_ids",
              {
                  "select":
                      "member_id,darthelfer_player_id",

                  "darthelfer_player_id":
                      "like.nuliga_person:*",

                  "order":
                      "darthelfer_player_id.asc"
              }
          )


          member_ids = {
              member["id"]
              for member in members
          }

          person_mapping = {}
          person_owners = {}


          for identity in identities:

              member_id = identity["member_id"]

              person_id = identity[
                  "darthelfer_player_id"
              ].split(":", 1)[1]

              if member_id not in member_ids:
                  raise RuntimeError(
                      "Unbekanntes Mitglied"
                  )

              if not person_id.isdigit():
                  raise RuntimeError(
                      "Ungültige Personen-ID"
                  )

              person_mapping.setdefault(
                  member_id,
                  set()
              ).add(person_id)

              person_owners.setdefault(
                  person_id,
                  set()
              ).add(member_id)


          if any(
              len(ids) != 1
              for ids in person_mapping.values()
          ):
              raise RuntimeError(
                  "Mehrdeutige Mitgliederzuordnung"
              )

          if any(
              len(ids) != 1
              for ids in person_owners.values()
          ):
              raise RuntimeError(
                  "Personen-ID mehrfach zugeordnet"
              )


          print(
              "Mitglieder insgesamt:",
              len(members)
          )

          print(
              "Mitglieder mit nuLiga-ID:",
              len(person_mapping)
          )

          print(
              "Mitglieder ohne nuLiga-ID:",
              len(members) - len(person_mapping)
          )


          all_careers = []
          all_reports = {}
          historical_reports = set()
          historical_members = set()
          historical_clubs = {}
          failures = []
          verified_members = set()


          for member in members:

              member_id = member["id"]

              if member_id not in person_mapping:
                  continue

              person_id = next(
                  iter(person_mapping[member_id])
              )

              name = (
                  member["first_name"] + " " +
                  member["last_name"]
              )

              print("=" * 60)

              print("Pruefe naechstes zugeordnetes Mitglied")

              start_url = (
                  BASE +
                  "playerPortrait?" +
                  urlencode({
                      "federation": "BDV",
                      "season": START_SEASON,
                      "person": person_id,
                      "club": CLUB
                  })
              )

              queue = deque([start_url])
              visited = set()
              member_careers = []
              member_failed = False


              while queue:

                  url = queue.popleft()

                  key = portrait_key(url)

                  if key in visited:
                      continue

                  if len(visited) >= 40:

                      failures.append({
                          "member_number":
                              member["member_number"],
                          "person_id": person_id,
                          "error":
                              "Sicherheitslimit erreicht"
                      })

                      member_failed = True
                      break

                  visited.add(key)

                  try:

                      content, final_url = fetch(url)

                      (
                          item,
                          links,
                          reports
                      ) = discover_portrait(
                          content,
                          final_url,
                          person_id
                      )

                      item["member_number"] = (
                          member["member_number"]
                      )

                      item["member_name"] = name
                      item["member_id"] = member_id

                      item_key = (
                          item["season"],
                          item["competition_type"],
                          item["club_id"],
                          item["source_season"]
                      )

                      known_keys = {
                          (
                              x["season"],
                              x["competition_type"],
                              x["club_id"],
                              x["source_season"]
                          )

                          for x in member_careers
                      }

                      if item_key not in known_keys:

                          member_careers.append(item)
                          all_careers.append(item)

                          print("Saison:", item["season"], "|", item["competition_type"], "| Fremdverein:", not item["is_dart_lions"], "| Berichtslinks:", item["report_count"])

                      for meeting_id, report in reports.items():

                          record = all_reports.setdefault(
                              meeting_id,
                              {
                                  **report,
                                  "person_ids": set(),
                                  "club_ids": set()
                              }
                          )

                          record["person_ids"].add(
                              person_id
                          )

                          record["club_ids"].add(
                              item["club_id"]
                          )

                          if not item["is_dart_lions"]:

                              historical_reports.add(
                                  meeting_id
                              )

                      if not item["is_dart_lions"]:

                          historical_members.add(
                              member_id
                          )

                          historical_clubs[
                              item["club_id"]
                          ] = item["club_name"]

                      for link_key, href in links.items():

                          if link_key not in visited:
                              queue.append(href)

                  except Exception as exc:

                      member_failed = True

                      failures.append({
                          "member_number":
                              member["member_number"],
                          "person_id": person_id,
                          "portrait_url": url,
                          "error": str(exc)
                      })

                      print(
                          "WARNUNG:",
                          type(exc).__name__,
                          str(exc) if isinstance(exc, RuntimeError) else "Abruffehler"
                      )

              if member_careers and not member_failed:

                  verified_members.add(member_id)


          print("=" * 60)
          print("FRÜHERE VEREINSKARRIEREN")
          print("=" * 60)


          for season in sorted({x["season"] for x in all_careers}):
              for kind in ("league", "cup"):
                  items = [x for x in all_careers if not x["is_dart_lions"] and x["season"] == season and x["competition_type"] == kind]
                  if items:
                      print(season, kind, "| Karriereabschnitte:", len(items), "| Ohne Berichtslinks (ungeprueft):", sum(not x["report_count"] for x in items))


          print("=" * 60)
          print("SPIELZEITEN")
          print("=" * 60)


          for season in sorted({
              x["season"]
              for x in all_careers
          }):

              print(season)


          print("=" * 60)
          print("EINDEUTIGE SPIELBERICHTE")
          print("=" * 60)


          print("Bekannter historischer Testbericht 6099260 gefunden:", "ja" if "6099260" in historical_reports else "nein")
          print("Historische Abschnitte ohne Berichtslinks (Verfuegbarkeit offen):", sum(not x["is_dart_lions"] and not x["report_count"] for x in all_careers))


          print("=" * 60)
          print("ZUSAMMENFASSUNG")
          print("=" * 60)


          print(
              "Mitglieder insgesamt:",
              len(members)
          )

          print(
              "Mitglieder mit nuLiga-ID:",
              len(person_mapping)
          )

          print(
              "Vollständig überprüfte Mitglieder:",
              len(verified_members)
          )

          print(
              "Mitglieder mit früheren Vereinen:",
              len(historical_members)
          )

          print(
              "Erkannte frühere Vereine:",
              len(historical_clubs)
          )

          print(
              "Erkannte Karriereabschnitte:",
              len(all_careers)
          )

          print(
              "Eindeutige Spielberichte insgesamt:",
              len(all_reports)
          )

          print(
              "Spielberichte früherer Vereine:",
              len(historical_reports)
          )

          print(
              "Fehler und offene Zuordnungen:",
              len(failures)
          )


          if failures:

              print("=" * 60)
              print("OFFENE PRÜFUNGEN")
              print("=" * 60)

              from collections import Counter
              for reason, count in Counter(f["error"] for f in failures).items():
                  # Nur bekannte Parserfehler ausgeben; externe Fehler koennen URLs enthalten.
                  safe = reason if reason in {"Saisonübersicht fehlt", "Vereinsübersicht fehlt", "Verein nicht eindeutig erkannt", "Vereins-ID stimmt nicht überein", "Falsche Personen-ID", "Spielzeit nicht erkannt", "Ungültige Spielzeit", "Sicherheitslimit erreicht", "Spielerportrait-Ueberschrift fehlt; Zugriff oder HTML pruefen", "Seiteninhalt fehlt"} else "Sonstiger Abruf- oder Parserfehler"
                  print(count, safe)

              raise RuntimeError(
                  "Karriereerkennung noch unvollständig"
              )


          if len(verified_members) != len(person_mapping):

              raise RuntimeError(
                  "Nicht alle Mitglieder überprüft"
              )


          print("=" * 60)
          if "6099260" not in historical_reports:
              raise RuntimeError("Bekannter historischer Testbericht fehlt; Zugriff oder Parser pruefen")


          from collections import Counter
          from urllib.error import HTTPError


          def pair(value):
              m = re.fullmatch(r'\s*(\d+)\s*:\s*(\d+)\s*', value)
              if not m:
                  raise ValueError('Ergebnisformat unbekannt')
              return tuple(map(int, m.groups()))


          def rows(table):
              return [r for r in table.select('tr') if r.find_parent('table') is table]


          def cells(row):
              return row.find_all(['td','th'], recursive=False)


          def people(cell, url):
              result = []
              for link in cell.select('a[href*="playerPortrait"]'):
                  href = urljoin(url, link['href'])
                  if urlparse(href).hostname != HOST:
                      raise ValueError('Fremder Spielerlink')
                  p = parameters(href)
                  if not p.get('person','').isdigit():
                      raise ValueError('Personen-ID fehlt')
                  result.append((p['person'], p.get('club','')))
              return result


          def kind(label):
              if re.fullmatch(r'\d+\s*-\s*\d+', label): return 'singles'
              if re.fullmatch(r'D\d+\s*-\s*D\d+', label, re.I): return 'doubles'
              if re.fullmatch(r'team(?:game|spiel)?', label, re.I): return 'team'
              return None


          def parse_results(content, url, expected):
              tables = [t for t in content.select('table') if re.search(r'\bLegs\s*:\s*\d+\s*:\s*\d+', txt(t), re.I) and any(cells(r) and kind(txt(cells(r)[0])) for r in rows(t))]
              if len(tables) != 1:
                  raise ValueError('Ergebnistabelle nicht eindeutig')
              matches, totals, seen = [], [], set()
              flags = Counter()
              for r in rows(tables[0]):
                  c = cells(r)
                  if not c: continue
                  label = txt(c[0])
                  total = re.search(r'\bLegs\s*:\s*(\d+\s*:\s*\d+)', txt(r), re.I)
                  if total:
                      totals.append((pair(total.group(1)), pair(txt(c[-1]))))
                      continue
                  if any(x.name == 'th' for x in c): continue
                  k = kind(label)
                  if not k:
                      if any(re.fullmatch(r'\d+\s*:\s*\d+', txt(x)) for x in c) or any(people(x,url) for x in c):
                          raise ValueError('Unbekannte Ergebniszeile')
                      continue
                  if len(c) != 6: raise ValueError('Unerwartete Ergebnis-Spaltenzahl')
                  if not txt(c[3]) and not txt(c[-1]) and k == 'team':
                      flags['unplayed_team'] += 1
                      continue
                  legs, sets, score = (pair(txt(c[i])) for i in (3,4,5))
                  if legs[0] == legs[1]: raise ValueError('Unentschieden in Einzelmatch')
                  win = (1,0) if legs[0] > legs[1] else (0,1)
                  if score != win or sets != win: raise ValueError('Sieger oder Satzsumme widerspruechlich')
                  pp = [people(c[1],url), people(c[2],url)]
                  unresolved = []
                  if k != 'team':
                      required = 1 if k == 'singles' else 2
                      for side, persons in enumerate(pp):
                          cell = c[side+1]
                          if len(persons) > required or len({x[0] for x in persons}) != len(persons):
                              raise ValueError('Doppelte oder zu viele Personen-IDs')
                          if len(persons) < required:
                              if not txt(cell):
                                  raise ValueError('Leere Aufstellung')
                              unresolved.append(side+1)
                      if unresolved:
                          flags['lineup_review_matches'] += 1
                          print('MANUELLE PRUEFUNG | Match:', label, '| Seiten:', unresolved, '| Verlinkte Personen:', [len(p) for p in pp])
                  if {x[0] for x in pp[0]} & {x[0] for x in pp[1]}: raise ValueError('Person auf beiden Seiten')
                  for p in pp: seen.update(x[0] for x in p)
                  # Originaltext nur im Speicher fuer den Zweitabruf; keine Namen im Log.
                  named = [[txt(a) for a in cell.select('a[href*="playerPortrait"]')] for cell in c[1:3]]
                  residual = []
                  for cell in c[1:3]:
                      clone = BeautifulSoup(str(cell),'html.parser')
                      for a in clone.select('a[href*="playerPortrait"]'): a.decompose()
                      residual.append(txt(clone))
                  matches.append((label,k,legs,score,pp,unresolved,[txt(c[1]),txt(c[2])],named,residual))
              if len(totals)!=1 or not matches: raise ValueError('Gesamtergebnis fehlt oder mehrfach')
              calc = tuple(tuple(sum(m[i][side] for m in matches) for side in (0,1)) for i in (2,3))
              if calc != totals[0]: raise ValueError('Summenabweichung Spiele oder Legs')
              if not expected <= seen:
                  flags['expected_persons_missing'] = len(expected - seen)
                  if not flags['lineup_review_matches']:
                      raise ValueError('Erwartete Personen fehlen in Spielzeilen')
              if len({m[0] for m in matches}) != len(matches): flags['repeated_labels'] += 1
              approved = any(txt(p).casefold() == 'spielbericht durch spielleiter genehmigt.' for p in content.select('p'))
              return dict(matches=matches, totals=totals[0], approved=approved, flags=dict(flags))


          def selftest():
              url = BASE+'groupMeetingReport?meeting=1'
              link = lambda p: f'<a href="{BASE}playerPortrait?person={p}&amp;club=114">X</a>'
              html = '<table><tr><th></th><th>H</th><th>A</th><th>1. Satz</th><th>Sätze</th><th>Spiele</th></tr>'
              html += '<tr><td>1-1</td><td>'+link(1)+'</td><td>'+link(2)+'</td><td>3:1</td><td>1:0</td><td>1:0</td></tr>'
              html += '<tr><td colspan="3">Legs: 3:1</td><td></td><td>1:0</td><td>1:0</td></tr></table>'
              assert parse_results(BeautifulSoup(html,'html.parser'),url,{'1'})['totals']==((3,1),(1,0))
              for bad in (html.replace('Legs: 3:1','Legs: 4:1'),html.replace('<td>1-1','<td>Unbekannt')):
                  try: parse_results(BeautifulSoup(bad,'html.parser'),url,{'1'})
                  except ValueError: pass
                  else: raise AssertionError('Fehler nicht erkannt')
              unlinked = html.replace(link(1), 'Unverlinkter Spieler')
              test = parse_results(BeautifulSoup(unlinked,'html.parser'),url,{'1'})
              assert test['flags']['lineup_review_matches'] == 1
              assert test['flags']['expected_persons_missing'] == 1
              assert test['matches'][0][4][0] == []
              for bad in (unlinked.replace('Legs: 3:1','Legs: 4:1'), html.replace(link(1), ''), html.replace(link(1),link(2))):
                  try: parse_results(BeautifulSoup(bad,'html.parser'),url,{'1'})
                  except ValueError: pass
                  else: raise AssertionError('Fehler nicht erkannt')
              print('Lokaler Parser-Selbsttest: OK')


          def parse_extras(content, url, result):
              titles={'Bestleistungen 180er':'180','Bestleistungen High Finishes':'highfinish','Bestleistungen Low Darts':'short_leg'}
              headings=[txt(h) for h in content.select('h2,h3,h4')]
              if any(headings.count(t)!=1 for t in titles): raise ValueError('Bestleistungsabschnitt fehlt oder doppelt')
              highlights=[]; averages=[]; seen_h=set(); seen_av=set(); section=''; remarks=[]
              roster=[{p[0] for m in result['matches'] for p in m[4][i]} for i in (0,1)]
              flags=Counter()
              for node in content.select('h1,h2,h3,h4,table'):
                  if node.name!='table':
                      section=txt(node); continue
                  rr=rows(node)
                  if not rr: continue
                  heads=[txt(c) for c in cells(rr[0])]
                  side={'Heimmannschaft':1,'Gastmannschaft':2}.get(' '.join(heads))
                  if side and any('Average' in txt(r) for r in rr[:3]):
                      if side in seen_av: raise ValueError('Average-Tabelle doppelt')
                      seen_av.add(side)
                      for r in rr:
                          c=cells(r)
                          if not c or any(x.name=='th' for x in c): continue
                          if len(c)!=2: raise ValueError('Average-Zeilenformat unbekannt')
                          p=people(c[0],url); v=txt(c[1]).replace(',','.')
                          if not re.fullmatch(r'\d+(?:\.\d+)?',v) or not 0<=float(v)<=180: raise ValueError('Average-Wert ungueltig')
                          if len(p)!=1 or p[0][0] not in roster[side-1]: flags['average_identity_review']+=1
                          if not txt(c[0]): raise ValueError('Average ohne Spielertext')
                          averages.append((side,p,txt(c[0]),float(v)))
                      continue
                  typ=titles.get(section)
                  if not typ: continue
                  if not {'Anzahl','Wert'}.issubset(heads): raise ValueError('Bestleistungstabellenkopf unbekannt')
                  if typ in seen_h: raise ValueError('Bestleistungstabelle doppelt')
                  seen_h.add(typ)
                  for r in rr:
                      c=cells(r)
                      if not c or any(x.name=='th' for x in c): continue
                      if len(c)!=4: raise ValueError('Bestleistungszeilenformat unbekannt')
                      if not all(re.fullmatch(r'\d+',txt(x)) for x in c[:2]): raise ValueError('Bestleistungswert nicht numerisch')
                      n,v=map(lambda x:int(txt(x)),c[:2]); p=people(c[2],url)
                      if n<1 or (typ=='180' and v!=180) or (typ=='highfinish' and not 2<=v<=170) or (typ=='short_leg' and v<9): raise ValueError('Bestleistungswert ungueltig')
                      if not txt(c[2]): raise ValueError('Bestleistung ohne Spielertext')
                      if len(p)!=1 or sum(bool(p and p[0][0] in r) for r in roster)!=1: flags['highlight_identity_or_team_review']+=1
                      highlights.append((typ,n,v,p,txt(c[2]),txt(c[3])))
              if ('Average der Spieler' in headings and seen_av!={1,2}) or ('Average der Spieler' not in headings and seen_av): raise ValueError('Average-Abschnitt unvollstaendig')
              for node in content.select('p,tr,div'):
                  if re.match(r'^Bemerkungen\s*:',txt(node),re.I) and not any(re.match(r'^Bemerkungen\s*:',txt(c),re.I) for c in node.select('p,tr,div')):
                      remarks.append(txt(node))
              # Any nonempty remark merits review; known cases stay blocked even if markup changes.
              substantive=[r for r in dict.fromkeys(remarks) if re.sub(r'^Bemerkungen\s*:\s*','',r,flags=re.I).strip()]
              if substantive or parameters(url).get('meeting') in {'6099266','6100970'}: flags['remarks_or_known_review']=1
              return dict(highlights=highlights,averages=averages,sections=sorted(seen_h),average_sides=sorted(seen_av),remarks=substantive,flags=dict(flags))

          def extra_selftest():
              u=BASE+'groupMeetingReport?meeting=1'
              h=''.join('<h2>'+x+'</h2>' for x in ('Bestleistungen 180er','Bestleistungen High Finishes','Bestleistungen Low Darts'))
              r={'matches':[]}
              assert parse_extras(BeautifulSoup(h,'html.parser'),u,r)['sections']==[]
              bad=h.replace('Bestleistungen Low Darts','Other')
              try: parse_extras(BeautifulSoup(bad,'html.parser'),u,r)
              except ValueError: pass
              else: raise AssertionError('Fehlender Abschnitt nicht erkannt')
              h+='<p>Bemerkungen: nachtraeglich gewertet</p>'
              assert parse_extras(BeautifulSoup(h,'html.parser'),u,r)['flags']['remarks_or_known_review']==1
              print('Bestleistungs-Selbsttest OK')


          import hashlib
          from datetime import datetime

          def build_event(content,url,report,d,ex):
              meeting=parameters(url)['meeting']
              tables=[t for t in content.select('table') if re.search(r'\bLegs\s*:\s*\d+\s*:\s*\d+',txt(t),re.I) and any(cells(r) and kind(txt(cells(r)[0])) for r in rows(t))]
              header=[txt(c) for c in cells(rows(tables[0])[0])]
              if len(header)<4 or not all(header[1:3]): raise ValueError('Mannschaftskopf fehlt')
              date_match=re.search(r'\b\d{2}\.\d{2}\.\d{4}\b',txt(content.h1)) if content.h1 else None
              if not date_match: raise ValueError('Spieldatum fehlt')
              champ=report['championship'] or ''
              info=season_info(champ)
              clubs=[{p[1] for m in d['matches'] for p in m[4][i] if p[1]} for i in (0,1)]
              if any('6042' in c for c in clubs): raise ValueError('Dart-Lions-Bericht im historischen Import')
              historical=set(report['club_ids'])-{'6042'}
              if not historical or sum(bool(c & historical) for c in clubs)!=1: raise ValueError('Historische Vereinsseite unklar')
              if any(len(c)!=1 for c in clubs): raise ValueError('Vereinsseite nicht eindeutig')
              clubids=[next(iter(c)) for c in clubs]
              roster=[{p[0] for m in d['matches'] for p in m[4][i]} for i in (0,1)]
              reviews=[]
              for key,value in sorted({**d['flags'],**ex['flags']}.items()):
                  if key!='unplayed_team' and value: reviews.append(dict(review_key=key,reason='Quellhinweis: '+key+' ('+str(value)+')'))
              matches=[]
              for idx,m in enumerate(d['matches'],1):
                  label,k,legs,score,pp,unresolved,texts,names,residual=m
                  players=[]
                  for i,persons in enumerate(pp):
                      for pos,(pid,cid) in enumerate(persons,1):
                          name=names[i][pos-1]
                          if not name: raise ValueError('Verlinkter Spielername fehlt')
                          players.append(dict(nuliga_person_id=pid,source_club_id=cid or None,player_name=name,player_side=i+1,player_position=pos,raw_data={'position_is_storage_order':True}))
                      if i+1 in unresolved:
                          # Preserve unlinked text separately; never infer an ID or a name from a linked partner.
                          name=residual[i].strip(' ,;/|')
                          if not name: raise ValueError('Unverlinkter Spielertext fehlt')
                          players.append(dict(nuliga_person_id=None,source_club_id=None,player_name=name,player_side=i+1,player_position=len(persons)+1,raw_data={'unresolved_source_text':texts[i],'position_is_storage_order':True,'may_represent_multiple_people':k=='doubles' and not persons}))
                  matches.append(dict(row_number=idx,match_label=label,match_type=k,home_legs=legs[0],away_legs=legs[1],players=players,raw_data={'side_texts':texts,'unresolved_sides':unresolved,'unlinked_text':residual}))
              averages=[]
              for idx,(side,pp,name,value) in enumerate(ex['averages'],1):
                  pid=pp[0][0] if len(pp)==1 and pp[0][0] in roster[side-1] else None
                  averages.append(dict(source_key='avg:'+str(idx),nuliga_person_id=pid,player_name=name,player_side=side,average=value,raw_data={'source_people':pp}))
              highlights=[]
              for idx,(typ,n,v,pp,name,team) in enumerate(ex['highlights'],1):
                  sides=[i+1 for i,r in enumerate(roster) if len(pp)==1 and pp[0][0] in r]
                  pid=pp[0][0] if len(sides)==1 else None
                  highlights.append(dict(source_key='highlight:'+str(idx),nuliga_person_id=pid,player_name=name,player_side=sides[0] if pid else None,highlight_type=typ,highlight_value=v,highlight_count=n,attribution='player' if pid else 'unknown',raw_data={'source_people':pp,'source_team':team}))
              result=dict(meeting_id=meeting,group_id=report['group_id'],season=info['season'],competition_type=info['competition_type'],competition_name=champ,event_date=datetime.strptime(date_match.group(),'%d.%m.%Y').date().isoformat(),home_team=header[1],away_team=header[2],home_club_id=clubids[0],away_club_id=clubids[1],home_score=d['totals'][1][0],away_score=d['totals'][1][1],home_legs=d['totals'][0][0],away_legs=d['totals'][0][1],report_url=report['report_url'],official_remarks='\n'.join(ex['remarks']) or None,is_approved=d['approved'],result_validated=True,matches=matches,averages=averages,highlights=highlights,reviews=reviews,raw_data={'flags':d['flags'],'extra_flags':ex['flags'],'highlight_tables':ex['sections'],'average_sides':ex['average_sides'],'remarks_detection_not_exhaustive':True})
              result['source_hash']=hashlib.sha256(json.dumps(result,sort_keys=True,ensure_ascii=False,separators=(',',':')).encode()).hexdigest()
              return result

          selftest()
          extra_selftest()
          events=[]
          counts, formats, failures = Counter(), Counter(), Counter()
          print('HISTORISCHE BESTLEISTUNGSVALIDIERUNG V1.0')
          for index, meeting in enumerate(sorted(historical_reports),1):
              report = all_reports[meeting]
              print("Spielbericht-URL:", report["report_url"])
              try:
                  content, url = fetch(report['report_url'])
                  if parameters(url).get('meeting') != meeting: raise ValueError('Falsche Meeting-ID')
                  d = parse_results(content,url,report['person_ids'])
                  content2, url2 = fetch(report['report_url'])
                  if parameters(url2).get('meeting') != meeting or d != parse_results(content2,url2,report['person_ids']): raise ValueError('Zweitabruf weicht ab')
                  if meeting == '6099260' and d['totals'] != ((21,25),(4,8)):
                      raise ValueError('Referenzergebnis weicht ab')
                  ex = parse_extras(content,url,d)
                  if ex != parse_extras(content2,url2,d): raise ValueError('Bestleistungen oder Bemerkungen im Zweitabruf abweichend')
                  event=build_event(content,url,report,d,ex)
                  if event != build_event(content2,url2,report,d,ex): raise ValueError('Importdaten im Zweitabruf abweichend')
                  events.append(event)
                  counts['extra_validated'] += 1
                  counts['average_rows'] += len(ex['averages'])
                  counts['average_reports'] += bool(ex['average_sides'])
                  for typ in ('180','highfinish','short_leg'):
                      counts[typ+'_tables'] += typ in ex['sections']
                      counts[typ+'_rows'] += sum(h[0]==typ for h in ex['highlights'])
                      counts[typ+'_count'] += sum(h[1] for h in ex['highlights'] if h[0]==typ)
                  counts.update(ex['flags'])
                  print('Bestleistungen:',dict(Counter(h[0] for h in ex['highlights'])),'| Tabellen:',ex['sections'],'| AVG-Zeilen:',len(ex['averages']),'| Pruefhinweise:',ex['flags'])
                  review = bool(ex['flags'] or d['flags'].get('lineup_review_matches') or d['flags'].get('expected_persons_missing'))
                  counts['reports_manual_review'] += review
                  counts['matches_manual_review'] += d['flags'].get('lineup_review_matches',0)
                  counts['reports_without_lineup_review'] += not review
                  if review: print('Meeting-ID:',meeting,'| KEINE FREIGABE FUER PERSOENLICHE STATISTIK')
                  types = Counter(m[1] for m in d['matches'])
                  formats[tuple(sorted(types.items()))] += 1
                  counts.update(types)
                  counts['validated'] += 1
                  counts['approved_marker'] += d['approved']
                  counts['no_approval_marker'] += not d['approved']
                  print('Bericht',index,'| Format:',dict(types),'| Spiele:',d['totals'][1],'| Legs:',d['totals'][0],'| Genehmigungsvermerk:',d['approved'],'| Hinweise:',d['flags'])
                  if meeting == '6099260':
                      print('Referenzbericht 6099260:',d['totals']==((21,25),(4,8)))
                      if d['totals']!=((21,25),(4,8)): raise ValueError('Referenzergebnis weicht ab')
              except Exception as e:
                  reason = str(e) if isinstance(e,ValueError) else f'HTTP {e.code}' if isinstance(e,HTTPError) else str(e) if isinstance(e,RuntimeError) and str(e) in {'Seiteninhalt fehlt','Unbekannter Host','Unbekanntes Weiterleitungsziel'} else type(e).__name__
                  failures[reason]+=1
                  print('Bericht',index,'| Meeting-ID:',meeting,'| PRUEFUNG OFFEN:',reason)
          print('ERGEBNISVALIDIERUNG:',dict(counts))
          print('FORMATVARIANTEN:',[(dict(k),v) for k,v in formats.items()])
          print('FEHLER:',dict(failures))
          if failures or counts['validated'] != len(historical_reports) or len(events)!=len(historical_reports): raise RuntimeError('Importvalidierung unvollstaendig; keine Schreiboperation')
          if not all(e['is_approved'] for e in events): raise RuntimeError('Nicht alle Berichte genehmigt')
          clubs=[dict(club_id=k,club_name=v) for k,v in sorted(historical_clubs.items())]
          fields=('member_id','club_id','season','competition_type','source_season','portrait_url','team_assignment','report_availability')
          memberships=[dict(**{k:x[k] for k in fields},nuliga_person_id=x['person_id']) for x in all_careers if not x['is_dart_lions']]
          payload=dict(clubs=clubs,memberships=memberships,events=events)
          print('IMPORTVORSCHAU:',dict(clubs=len(clubs),memberships=len(memberships),events=len(events),matches=sum(len(e['matches']) for e in events),players=sum(len(m['players']) for e in events for m in e['matches']),averages=sum(len(e['averages']) for e in events),highlights=sum(len(e['highlights']) for e in events),review_events=sum(bool(e['reviews']) for e in events)))
          if os.environ.get('WRITE_IMPORT')!='true':
              print('TESTMODUS: keine Datenbankänderungen. GAME ON!')
          else:
              request=Request(REST+'rpc/pc_career_import_initial',data=json.dumps({'p_payload':payload},ensure_ascii=False).encode(),headers={'apikey':SUPABASE_KEY,'Authorization':'Bearer '+SUPABASE_KEY,'Content-Type':'application/json','Accept':'application/json'},method='POST')
              try:
                  with urlopen(request,timeout=120) as response: result=json.loads(response.read())
              except HTTPError as e:
                  print('RPC HTTP-Status:',e.code)
                  # Error details may contain names or raw records. Do not print them in a public log.
                  raise RuntimeError('Historischer Import fehlgeschlagen; Datenbankstatus pruefen') from None
              if not isinstance(result,dict) or result.get('status')!='completed' or result.get('statistics_released')!=0: raise RuntimeError('Unerwartete RPC-Antwort; Datenbankstatus pruefen')
              print('IMPORTERGEBNIS:',json.dumps(result))
              print('GAME ON!')

          PY
